<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Consultant Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f4ef;--panel:#fffdf9;--fg:#1d2420;--mute:#66706a;--line:#e3dfd5;--accent:#1f5c4a;--accent-fg:#fff;--soft:#e4efe9;--warn:#8a5a12;--warnbg:#f6ead2;--err:#a63a2b;--errbg:#f8e4e0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--panel:#1a211e;--fg:#e8ece9;--mute:#98a39d;--line:#2b3531;--accent:#6fc4a4;--accent-fg:#0d1512;--soft:#22322c;--warn:#e3b765;--warnbg:#3a2f18;--err:#f0958a;--errbg:#3d2420;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--panel:#1a211e;--fg:#e8ece9;--mute:#98a39d;--line:#2b3531;--accent:#6fc4a4;--accent-fg:#0d1512;--soft:#22322c;--warn:#e3b765;--warnbg:#3a2f18;--err:#f0958a;--errbg:#3d2420;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,sans-serif;padding-inline:16px;padding-block:24px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font:600 28px/1.15 Fraunces,Georgia,serif;margin:0;text-wrap:balance}
h2{font:600 12px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
p{margin:0}.sub{color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
textarea,input{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit}
textarea{min-height:96px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
button{background:var(--accent);color:var(--accent-fg);border:0;border-radius:8px;padding:10px 18px;font:600 14px Inter,sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.ghost{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{background:var(--soft);color:var(--accent);border:0;font-weight:500;font-size:13px;padding:6px 12px;border-radius:99px}
.item{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:0}
.item b{font-weight:600}
.cite{font-size:12px;color:var(--accent);font-weight:600;margin-left:6px;white-space:nowrap}
.notice{padding:12px 14px;border-radius:8px;background:var(--warnbg);color:var(--warn)}
.error{padding:12px 14px;border-radius:8px;background:var(--errbg);color:var(--err)}
.src{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.src:first-of-type{border-top:0}.src span:first-child{color:var(--accent);font-weight:600}
.src small{color:var(--mute);font-variant-numeric:tabular-nums}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:8px;animation:p 1s infinite alternate}
@keyframes p{to{opacity:.2}}
ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
</style>
<div class="wrap">
  <header><p class="sub" style="font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px">Command center</p>
  <h1>What's the situation?</h1>
  <p class="sub" style="margin-top:6px">Describe it in plain words. The worker searches your library and reasons only from what it finds.</p></header>

  <section class="card">
    <textarea id="sit" placeholder="e.g. The company is noticing signs of slow sales but can't understand why."></textarea>
    <div class="chips" id="chips"></div>
    <div class="grid">
      <label>Industry<input id="i_industry" placeholder="optional"></label>
      <label>Company size<input id="i_size" placeholder="optional"></label>
      <label>Growth stage<input id="i_stage" placeholder="optional"></label>
      <label>Leadership team<input id="i_team" placeholder="optional"></label>
    </div>
    <div class="row"><button id="go">Run diagnosis</button><span id="status" class="sub"></span></div>
  </section>

  <div id="out" class="wrap" style="gap:16px"></div>
</div>
<script>
const PROJECT='xtkhzicrloqwgxdsfwvc', SERVER='Supabase';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lit=s=>"'"+String(s).replace(/\0/g,'').replace(/'/g,"''")+"'";
const examples=['Sales are slowing and we cannot tell why','Our best people are disengaged','We outgrew the founder-run way of working','Nobody knows who owns what decisions'];
$('chips').innerHTML=examples.map(e=>`<button class="chip" type="button">${esc(e)}</button>`).join('');
$('chips').onclick=e=>{if(e.target.classList.contains('chip'))$('sit').value=e.target.textContent};

let mcp=null;
claude.use('mcp').then(m=>{mcp=m;if(!m){fail('This view cannot reach your connectors. Open the page in Claude.')}}).catch(()=>{});

function fail(msg){$('out').innerHTML=`<div class="error">${esc(msg)}</div>`}
function errMsg(e){
  switch(e&&e.code){
    case 'needs_reauth':return 'Reconnect Supabase in Settings → Connectors, then try again.';
    case 'server_not_connected':return 'Add the Supabase connector in Settings → Connectors, then reload.';
    case 'not_in_manifest':case 'consent_required':return 'Access to Supabase was declined for this page. Reload and allow it to run diagnoses.';
    case 'server_unavailable':return 'Supabase did not answer in time. Try again in a moment.';
    default:return (e&&e.message)||'Something unexpected happened.';
  }
}
async function sql(query){
  const r=await mcp.callTool(SERVER,'execute_sql',{project_id:PROJECT,query},{cache:false});
  let t=r.payload;
  if(Array.isArray(t))return t;
  if(t&&typeof t==='object'&&typeof t.result==='string')t=t.result;
  if(typeof t!=='string'){
    t=(r.content&&r.content[0]&&r.content[0].text)||'';
    try{const j=JSON.parse(t);if(j&&typeof j.result==='string')t=j.result}catch(_){}
  }
  const a=t.indexOf('['),b=t.lastIndexOf(']');
  if(a<0||b<a)throw {message:'Unexpected reply from the database.'};
  return JSON.parse(t.slice(a,b+1));
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let busy=false;
$('go').onclick=async()=>{
  const s=$('sit').value.trim(); if(!s||busy)return;
  if(!mcp){fail('This view cannot reach your connectors. Open the page in Claude.');return}
  busy=true;$('go').disabled=true;$('out').innerHTML='';
  const intake={};
  [['industry','i_industry'],['company_size','i_size'],['growth_stage','i_stage'],['leadership_team','i_team']].forEach(([k,id])=>{const v=$(id).value.trim();if(v)intake[k]=v});
  const t0=Date.now();
  $('status').innerHTML='<span class="pulse"></span>Searching your library and reasoning…';
  try{
    const id=(await sql(`select public.start_diagnosis(${lit(s)}, ${lit(JSON.stringify(intake))}::jsonb) as id`))[0].id;
    let res=null;
    while(Date.now()-t0<110000){
      await sleep(3500);
      const d=(await sql(`select public.get_diagnosis(${Number(id)})::text as d`))[0].d;
      const o=typeof d==='string'?JSON.parse(d):d;
      if(o.status==='done'){res=o;break}
    }
    if(!res)throw {message:'The worker took too long. Try again.'};
    if(res.code!==200){const m=res.body&&(res.body.error||res.body.message);throw {message:m?String(m):('The worker returned an error ('+res.code+').')}}
    render(res.body);
    $('status').textContent='Done in '+Math.round((Date.now()-t0)/1000)+'s';
  }catch(e){fail(errMsg(e));$('status').textContent=''}
  busy=false;$('go').disabled=false;
};
const cites=a=>'';
function render(b){
  const a=b.analysis||{};
  let h=`<section class="card"><h2>The read</h2><p>${esc(a.situation_read)}</p></section>`;
  if((a.likely_causes||[]).length)h+=`<section class="card"><h2>Likely causes</h2>${a.likely_causes.map(c=>`<div class="item"><span><b>${esc(c.cause)}</b>${cites(c.sources)}</span><span class="sub">${esc(c.why)}</span></div>`).join('')}</section>`;
  if((a.first_moves||[]).length)h+=`<section class="card"><h2>First moves</h2>${a.first_moves.map((m,i)=>`<div class="item"><span><b>${i+1}. ${esc(m.move)}</b>${cites(m.sources)}</span><span class="sub">${esc(m.how)}</span></div>`).join('')}</section>`;
  if((a.questions_to_ask||[]).length)h+=`<section class="card"><h2>Questions to ask</h2><ul>${a.questions_to_ask.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></section>`;
  if(a.gaps)h+=`<div class="notice"><b>Gaps in the library.</b> ${esc(a.gaps)}</div>`;
  $('out').innerHTML=h;
}
</script>

</body></html>
